<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tagalong: group trip planner</title>
  <meta name="description" content="Plan a trip with your group, vote on ideas, split every bill to the cent, and keep a private travel history. No account, works offline.">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tagalong">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var theme = "auto";
      try {
        theme = JSON.parse(localStorage.getItem("tagalong.v1") || "{}").theme || "auto";
      } catch (error) {}
      if (theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">Tagalong needs JavaScript to run. Nothing you enter leaves this device.</p></noscript>
  <script src="world.js"></script>
  <script src="core.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
